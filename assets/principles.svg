<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 452" width="1200" height="452" role="img" aria-label="how I build">
<title>how I build</title>
<defs>
  <radialGradient id="core" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#a855f7" stop-opacity=".5"/>
    <stop offset="60%" stop-color="#a855f7" stop-opacity=".1"/>
    <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="pedge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
    <stop offset="50%" stop-color="#22d3ee" stop-opacity=".9"/>
    <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
  </linearGradient>
  <filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <pattern id="pmesh" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1" fill="#a855f7" opacity=".12"/>
  </pattern>
</defs>

<rect width="1200" height="452" fill="#07060b"/>
<rect width="1200" height="452" fill="url(#pmesh)"/>

<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <text x="64" y="52" fill="#22d3ee" font-size="13" letter-spacing="4">02 &#183; HOW I BUILD</text>
  <text x="1136" y="52" fill="#6d5a8f" font-size="12" letter-spacing="2" text-anchor="end">FOUR RULES, NO EXCEPTIONS</text>
  <line x1="64" y1="66" x2="1136" y2="66" stroke="#a855f7" stroke-opacity=".22"/>

  <g>
    <rect x="64" y="100" width="700" height="72" rx="10" fill="#0d0a17" stroke="#a855f7" stroke-opacity=".26"/>
    <rect x="84" y="100" width="660" height="2" fill="url(#pedge)"><animate attributeName="opacity" values=".2;.9;.2" dur="3.6s" repeatCount="indefinite"/></rect>
    <text x="90" y="132" fill="#22d3ee" font-size="19" font-weight="bold">01</text>
    <text x="128" y="130" fill="#f2e8ff" font-size="15" font-weight="bold">stdlib first</text>
    <text x="128" y="152" fill="#9a86bd" font-size="12.5">a dependency has to earn its place - the 2048 engine has zero</text>
  </g>

  <g>
    <rect x="64" y="184" width="700" height="72" rx="10" fill="#0d0a17" stroke="#a855f7" stroke-opacity=".26"/>
    <rect x="84" y="184" width="660" height="2" fill="url(#pedge)"><animate attributeName="opacity" values=".2;.9;.2" dur="3.6s" begin="-.9s" repeatCount="indefinite"/></rect>
    <text x="90" y="216" fill="#22d3ee" font-size="19" font-weight="bold">02</text>
    <text x="128" y="214" fill="#f2e8ff" font-size="15" font-weight="bold">measure it, then believe it</text>
    <text x="128" y="236" fill="#9a86bd" font-size="12.5">selftest.py checks the bitboard against a naive reference; --simulate proves the AI</text>
  </g>

  <g>
    <rect x="64" y="268" width="700" height="72" rx="10" fill="#0d0a17" stroke="#a855f7" stroke-opacity=".26"/>
    <rect x="84" y="268" width="660" height="2" fill="url(#pedge)"><animate attributeName="opacity" values=".2;.9;.2" dur="3.6s" begin="-1.8s" repeatCount="indefinite"/></rect>
    <text x="90" y="300" fill="#22d3ee" font-size="19" font-weight="bold">03</text>
    <text x="128" y="298" fill="#f2e8ff" font-size="15" font-weight="bold">core and shell stay apart</text>
    <text x="128" y="320" fill="#9a86bd" font-size="12.5">engine, GUI and CLI are separate modules - the AI never imports tkinter</text>
  </g>

  <g>
    <rect x="64" y="352" width="700" height="72" rx="10" fill="#0d0a17" stroke="#a855f7" stroke-opacity=".26"/>
    <rect x="84" y="352" width="660" height="2" fill="url(#pedge)"><animate attributeName="opacity" values=".2;.9;.2" dur="3.6s" begin="-2.7s" repeatCount="indefinite"/></rect>
    <text x="90" y="384" fill="#22d3ee" font-size="19" font-weight="bold">04</text>
    <text x="128" y="382" fill="#f2e8ff" font-size="15" font-weight="bold">ship the whole thing</text>
    <text x="128" y="404" fill="#9a86bd" font-size="12.5">launcher scripts, an .exe build and a README, or it is not finished</text>
  </g>

  <g transform="translate(958,250)">
    <circle r="132" fill="url(#core)"/>
    <g fill="none" stroke="#a855f7" stroke-opacity=".32">
      <ellipse rx="140" ry="50" stroke-dasharray="5 9">
        <animate attributeName="stroke-dashoffset" values="0;140" dur="7s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="140" ry="50" transform="rotate(60)"/>
      <ellipse rx="140" ry="50" transform="rotate(-60)"/>
    </g>

    <circle r="36" fill="#0d0a17" stroke="#22d3ee" stroke-width="1.6"/>
    <circle r="36" fill="none" stroke="#e879f9" stroke-width="1.6" stroke-dasharray="15 210">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text y="6" text-anchor="middle" font-size="15" fill="#f2e8ff" letter-spacing="1">py</text>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      <g transform="translate(140,0)"><circle r="5" fill="#22d3ee" filter="url(#pglow)"/><circle r="3.4" fill="#e6faff"/></g>
      <g transform="rotate(120) translate(140,0)"><circle r="5" fill="#e879f9" filter="url(#pglow)"/><circle r="3.4" fill="#ffe9ff"/></g>
      <g transform="rotate(240) translate(140,0)"><circle r="5" fill="#a855f7" filter="url(#pglow)"/><circle r="3.4" fill="#f3e6ff"/></g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
      <g transform="rotate(60) translate(90,0)"><circle r="4" fill="#67e8f9"/></g>
      <g transform="rotate(200) translate(90,0)"><circle r="4" fill="#f0abfc"/></g>
    </g>
  </g>

  <text x="958" y="106" text-anchor="middle" fill="#6d5a8f" font-size="11" letter-spacing="2.6">EVERYTHING ORBITS ONE LANGUAGE</text>
</g>
</svg>
