<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="a kernel written from scratch">
<title>a kernel written from scratch</title>
<defs>
  <pattern id="mesh" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1" fill="#7dffa4" opacity=".12"/>
  </pattern>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" fill="#ffffff" opacity=".05"/>
  </pattern>
  <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
    <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity=".62"/>
  </radialGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7dffa4" stop-opacity="0"/>
    <stop offset="50%" stop-color="#7dffa4" stop-opacity=".9"/>
    <stop offset="100%" stop-color="#7dffa4" stop-opacity="0"/>
  </linearGradient>
  <filter id="phosphor" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <clipPath id="c1"><rect x="100" y="163" width="0" height="22"><animate attributeName="width" values="0;0;465;465;0;0" keyTimes="0;0.02727;0.10145;.965;.972;1" dur="11.00s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="c2"><rect x="100" y="202.0" width="0" height="22"><animate attributeName="width" values="0;0;105;105;0;0" keyTimes="0;0.12418;0.14418;.965;.972;1" dur="11.00s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="c3"><rect x="100" y="228.0" width="0" height="22"><animate attributeName="width" values="0;0;438;438;0;0" keyTimes="0;0.16236;0.21473;.965;.972;1" dur="11.00s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="c4"><rect x="100" y="267.0" width="0" height="22"><animate attributeName="width" values="0;0;456;456;0;0" keyTimes="0;0.24200;0.29655;.965;.972;1" dur="11.00s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="c5"><rect x="100" y="293.0" width="0" height="22"><animate attributeName="width" values="0;0;222;222;0;0" keyTimes="0;0.31473;0.35836;.965;.972;1" dur="11.00s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<rect width="1200" height="660" fill="#050705"/>
<rect width="1200" height="660" fill="url(#mesh)"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect x="64" y="34" width="34" height="22" rx="5" fill="#7dffa4" opacity=".16"/>
  <text x="81" y="50" text-anchor="middle" fill="#7dffa4" font-size="12" font-weight="bold" letter-spacing="1">03</text>
  <text x="110" y="50" fill="#7dffa4" font-size="13" letter-spacing="4">THE KERNEL</text>
  <text x="1136" y="50" fill="#6d5a8f" font-size="12" letter-spacing="2" text-anchor="end">C + x86_64 ASM · QEMU · NO BASE DISTRO</text>
  <line x1="64" y1="66" x2="1136" y2="66" stroke="#7dffa4" stroke-opacity=".22"/>
</g>
  <rect x="64" y="96" width="536" height="500" rx="10" fill="#020403" stroke="#2f7a4a" stroke-opacity=".5"/>
  <path d="M76,96 H588 a10,10 0 0 1 10,10 V130 H64 V106 a10,10 0 0 1 12,-10 Z" fill="#0a140d"/>
  <line x1="64" y1="130" x2="600" y2="130" stroke="#2f7a4a" stroke-opacity=".6"/>
  <circle cx="88" cy="113" r="5" fill="#ff5f57"/><circle cx="106" cy="113" r="5" fill="#febc2e"/><circle cx="124" cy="113" r="5" fill="#28c840"/>
  <text x="332" y="118" text-anchor="middle" fill="#2f7a4a" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1.2">QEMU — flo.img</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" filter="url(#phosphor)">
  <g clip-path="url(#c1)"><text x="104" y="178" font-size="15" textLength="459" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#2f7a4a">$&#160;</tspan><tspan fill="#e6ffe9">qemu-system-x86_64&#160;-drive&#160;format=raw,file=flo.img</tspan></text></g>
  <rect x="104" y="166" width="9.0" height="15" fill="#7dffa4" opacity="0"><animate attributeName="x" values="104;104;563;563;104;104" keyTimes="0;0.02727;0.10145;.965;.972;1" dur="11.00s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02727;0.02818;0.11236;0.11327;1" dur="11.00s" repeatCount="indefinite"/></rect>
  <g clip-path="url(#c2)"><text x="104" y="217.0" font-size="15" textLength="99" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#7dffa4">Booting&#160;...</tspan></text></g>
  <rect x="104" y="205" width="9.0" height="15" fill="#7dffa4" opacity="0"><animate attributeName="x" values="104;104;203;203;104;104" keyTimes="0;0.12418;0.14418;.965;.972;1" dur="11.00s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12418;0.12509;0.15509;0.15600;1" dur="11.00s" repeatCount="indefinite"/></rect>
  <g clip-path="url(#c3)"><text x="104" y="243.0" font-size="15" textLength="432" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#ffb454">[&#160;ok&#160;]&#160;</tspan><tspan fill="#2f7a4a">stage1&#160;handed&#160;control&#160;to&#160;the&#160;kernel&#160;entry</tspan></text></g>
  <rect x="104" y="231" width="9.0" height="15" fill="#7dffa4" opacity="0"><animate attributeName="x" values="104;104;536;536;104;104" keyTimes="0;0.16236;0.21473;.965;.972;1" dur="11.00s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.16236;0.16327;0.22564;0.22655;1" dur="11.00s" repeatCount="indefinite"/></rect>
  <g clip-path="url(#c4)"><text x="104" y="282.0" font-size="15" textLength="450" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#2f7a4a">everything&#160;under&#160;this&#160;line&#160;is&#160;still&#160;being&#160;written.</tspan></text></g>
  <rect x="104" y="270" width="9.0" height="15" fill="#7dffa4" opacity="0"><animate attributeName="x" values="104;104;554;554;104;104" keyTimes="0;0.24200;0.29655;.965;.972;1" dur="11.00s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24200;0.24291;0.30745;0.30836;1" dur="11.00s" repeatCount="indefinite"/></rect>
  <g clip-path="url(#c5)"><text x="104" y="308.0" font-size="15" textLength="216" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#e6ffe9">that&#160;is&#160;the&#160;whole&#160;point.</tspan></text></g>
  <rect x="104" y="296" width="9.0" height="15" fill="#7dffa4" opacity="0"><animate attributeName="x" values="104;104;320;320;104;104" keyTimes="0;0.31473;0.35836;.965;.972;1" dur="11.00s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31473;0.31564;0.36927;0.37018;1" dur="11.00s" repeatCount="indefinite"/></rect>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38564;0.38655;.965;.972;1" dur="11.00s" repeatCount="indefinite"/><rect x="104" y="322" width="9.0" height="15" fill="#7dffa4"><animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></rect></g>
</g>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <text x="636" y="118" fill="#6d5a8f" font-size="11" letter-spacing="2.6">SUBSYSTEM ROADMAP</text>
  <text x="1136" y="118" text-anchor="end" fill="#6d5a8f" font-size="11" letter-spacing="1.6">1 OF 6</text>
  <g>
    <rect x="636" y="150" width="500" height="60" rx="9" fill="#0d0a17" stroke="#7dffa4" stroke-opacity=".9"/>
    <rect x="636" y="150" width="4" height="60" rx="2" fill="#7dffa4" opacity=".9"/>
    <text x="660" y="176" fill="#f2e8ff" font-size="14" font-weight="bold">bootloader</text>
    <text x="660" y="196" fill="#6d5a8f" font-size="12">stage1 loads and jumps to the kernel</text>
    <rect x="1030" y="166" width="88" height="24" rx="12" fill="#7dffa4" opacity=".14"/>
    <text x="1074" y="182" text-anchor="middle" fill="#7dffa4" font-size="10.5" letter-spacing="1.4">DONE</text>
  </g>
  <g>
    <rect x="636" y="224" width="500" height="60" rx="9" fill="#0d0a17" stroke="#ffb454" stroke-opacity=".8"/>
    <rect x="636" y="224" width="4" height="60" rx="2" fill="#ffb454" opacity=".8"/>
    <text x="660" y="250" fill="#f2e8ff" font-size="14" font-weight="bold">vga text output</text>
    <text x="660" y="270" fill="#6d5a8f" font-size="12">write to 0xB8000, then a real console</text>
    <rect x="1030" y="240" width="88" height="24" rx="12" fill="#ffb454" opacity=".14"/>
    <text x="1074" y="256" text-anchor="middle" fill="#ffb454" font-size="10.5" letter-spacing="1.4">NEXT</text>
  </g>
  <g>
    <rect x="636" y="298" width="500" height="60" rx="9" fill="#0d0a17" stroke="#6d5a8f" stroke-opacity=".5"/>
    <rect x="636" y="298" width="4" height="60" rx="2" fill="#6d5a8f" opacity=".5"/>
    <text x="660" y="324" fill="#f2e8ff" font-size="14" font-weight="bold">gdt / idt</text>
    <text x="660" y="344" fill="#6d5a8f" font-size="12">descriptor tables and interrupt handlers</text>
    <rect x="1030" y="314" width="88" height="24" rx="12" fill="#6d5a8f" opacity=".14"/>
    <text x="1074" y="330" text-anchor="middle" fill="#6d5a8f" font-size="10.5" letter-spacing="1.4">PLANNED</text>
  </g>
  <g>
    <rect x="636" y="372" width="500" height="60" rx="9" fill="#0d0a17" stroke="#6d5a8f" stroke-opacity=".5"/>
    <rect x="636" y="372" width="4" height="60" rx="2" fill="#6d5a8f" opacity=".5"/>
    <text x="660" y="398" fill="#f2e8ff" font-size="14" font-weight="bold">keyboard</text>
    <text x="660" y="418" fill="#6d5a8f" font-size="12">ps/2 driver, scancodes to characters</text>
    <rect x="1030" y="388" width="88" height="24" rx="12" fill="#6d5a8f" opacity=".14"/>
    <text x="1074" y="404" text-anchor="middle" fill="#6d5a8f" font-size="10.5" letter-spacing="1.4">PLANNED</text>
  </g>
  <g>
    <rect x="636" y="446" width="500" height="60" rx="9" fill="#0d0a17" stroke="#6d5a8f" stroke-opacity=".5"/>
    <rect x="636" y="446" width="4" height="60" rx="2" fill="#6d5a8f" opacity=".5"/>
    <text x="660" y="472" fill="#f2e8ff" font-size="14" font-weight="bold">memory</text>
    <text x="660" y="492" fill="#6d5a8f" font-size="12">physical allocator, then paging</text>
    <rect x="1030" y="462" width="88" height="24" rx="12" fill="#6d5a8f" opacity=".14"/>
    <text x="1074" y="478" text-anchor="middle" fill="#6d5a8f" font-size="10.5" letter-spacing="1.4">PLANNED</text>
  </g>
  <g>
    <rect x="636" y="520" width="500" height="60" rx="9" fill="#0d0a17" stroke="#6d5a8f" stroke-opacity=".5"/>
    <rect x="636" y="520" width="4" height="60" rx="2" fill="#6d5a8f" opacity=".5"/>
    <text x="660" y="546" fill="#f2e8ff" font-size="14" font-weight="bold">scheduler</text>
    <text x="660" y="566" fill="#6d5a8f" font-size="12">tasks, context switching, timers</text>
    <rect x="1030" y="536" width="88" height="24" rx="12" fill="#6d5a8f" opacity=".14"/>
    <text x="1074" y="552" text-anchor="middle" fill="#6d5a8f" font-size="10.5" letter-spacing="1.4">PLANNED</text>
  </g>
  <rect x="636" y="606" width="500" height="5" rx="2.5" fill="#1d1630"/>
  <rect x="636" y="606" width="0" height="5" rx="2.5" fill="#7dffa4"><animate attributeName="width" from="0" to="83" dur="1.2s" fill="freeze"/></rect>
  <text x="104" y="626" fill="#2f7a4a" font-size="12">no fork, no base distro - this one starts at the boot sector</text>
</g>
<rect width="1200" height="660" fill="url(#scan)"/>
<rect width="1200" height="660" fill="url(#vignette)"/>
<rect x="0" y="-80" width="1200" height="80" fill="#7dffa4" opacity=".05" filter="url(#soft)">
  <animate attributeName="y" values="-80;660" dur="7s" repeatCount="indefinite"/>
</rect>
</svg>
