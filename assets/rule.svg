<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="1200" height="28" role="img" aria-label="divider">
<defs>
  <linearGradient id="rl" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
    <stop offset="18%" stop-color="#a855f7" stop-opacity=".65"/>
    <stop offset="50%" stop-color="#22d3ee" stop-opacity=".9"/>
    <stop offset="82%" stop-color="#e879f9" stop-opacity=".65"/>
    <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
  </linearGradient>
  <filter id="rg" x="-50%" y="-400%" width="200%" height="900%">
    <feGaussianBlur stdDeviation="2.5"/>
  </filter>
</defs>
<line x1="0" y1="14" x2="1200" y2="14" stroke="url(#rl)" stroke-width="1.6" filter="url(#rg)" opacity=".7"/>
<line x1="0" y1="14" x2="1200" y2="14" stroke="url(#rl)" stroke-width="1.2"/>
<g fill="#e6faff">
  <circle cy="14" r="2.6" cx="0"><animate attributeName="cx" values="-40;1240" dur="4.5s" repeatCount="indefinite"/></circle>
  <circle cy="14" r="2" cx="0" opacity=".75"><animate attributeName="cx" values="-40;1240" dur="4.5s" begin="-1.6s" repeatCount="indefinite"/></circle>
  <circle cy="14" r="1.6" cx="0" opacity=".55"><animate attributeName="cx" values="-40;1240" dur="4.5s" begin="-3.1s" repeatCount="indefinite"/></circle>
</g>
<g fill="#a855f7" opacity=".8">
  <rect x="596" y="8" width="8" height="12" rx="1">
    <animate attributeName="opacity" values=".3;1;.3" dur="2.2s" repeatCount="indefinite"/>
  </rect>
</g>
</svg>
