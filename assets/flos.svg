<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 612" width="1200" height="612" role="img" aria-label="FLOS - an atomic Arch distribution">
<title>FLOS - an atomic Arch distribution</title>
<defs>
  <pattern id="mesh" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1" fill="#5ac8fa" opacity=".12"/>
  </pattern>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" fill="#ffffff" opacity=".05"/>
  </pattern>
  <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
    <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity=".62"/>
  </radialGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#5ac8fa" stop-opacity="0"/>
    <stop offset="50%" stop-color="#5ac8fa" stop-opacity=".9"/>
    <stop offset="100%" stop-color="#5ac8fa" stop-opacity="0"/>
  </linearGradient>
  <filter id="phosphor" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
</defs>
<rect width="1200" height="612" fill="#05080c"/>
<rect width="1200" height="612" fill="url(#mesh)"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect x="64" y="34" width="34" height="22" rx="5" fill="#5ac8fa" opacity=".16"/>
  <text x="81" y="50" text-anchor="middle" fill="#5ac8fa" font-size="12" font-weight="bold" letter-spacing="1">02</text>
  <text x="110" y="50" fill="#5ac8fa" font-size="13" letter-spacing="4">FLOS</text>
  <text x="1136" y="50" fill="#6d5a8f" font-size="12" letter-spacing="2" text-anchor="end">FLO-OS.DE · PRE-RELEASE</text>
  <line x1="64" y1="66" x2="1136" y2="66" stroke="#5ac8fa" stroke-opacity=".22"/>
</g>
  <rect x="64" y="96" width="536" height="448" rx="12" fill="#0d0a17" stroke="#5ac8fa" stroke-opacity=".26"/>
  <rect x="86" y="96" width="492" height="2" fill="url(#edge)"><animate attributeName="opacity" values=".25;1;.25" dur="3.4s" repeatCount="indefinite"/></rect>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <text x="92" y="128" fill="#6d5a8f" font-size="11" letter-spacing="2.6">SPECIFICATION</text>
  <text x="92" y="166" fill="#f2e8ff" font-size="20" font-weight="bold">Linux in full bloom</text>
  <text x="92" y="190" fill="#9fc3d6" font-size="12.5">a gaming-ready, atomic KDE Plasma Wayland distribution on Arch</text>
  <text x="92" y="228" fill="#6d5a8f" font-size="11.5" letter-spacing="1.4">RELEASE</text>
  <text x="572" y="228" text-anchor="end" fill="#cfe3ee" font-size="12.5">26.10 “Amaryllis”</text>
  <line x1="92" y1="238" x2="572" y2="238" stroke="#5ac8fa" stroke-opacity=".1"/>
  <text x="92" y="262" fill="#6d5a8f" font-size="11.5" letter-spacing="1.4">BASE</text>
  <text x="572" y="262" text-anchor="end" fill="#cfe3ee" font-size="12.5">Arch · Btrfs · signed UKI</text>
  <line x1="92" y1="272" x2="572" y2="272" stroke="#5ac8fa" stroke-opacity=".1"/>
  <text x="92" y="296" fill="#6d5a8f" font-size="11.5" letter-spacing="1.4">DESKTOP</text>
  <text x="572" y="296" text-anchor="end" fill="#cfe3ee" font-size="12.5">KDE Plasma 6.7 · Wayland only</text>
  <line x1="92" y1="306" x2="572" y2="306" stroke="#5ac8fa" stroke-opacity=".1"/>
  <text x="92" y="330" fill="#6d5a8f" font-size="11.5" letter-spacing="1.4">TARGET</text>
  <text x="572" y="330" text-anchor="end" fill="#cfe3ee" font-size="12.5">x86_64 UEFI · Secure Boot</text>
  <line x1="92" y1="340" x2="572" y2="340" stroke="#5ac8fa" stroke-opacity=".1"/>
  <text x="92" y="364" fill="#6d5a8f" font-size="11.5" letter-spacing="1.4">GAMING</text>
  <text x="572" y="364" text-anchor="end" fill="#cfe3ee" font-size="12.5">Steam · gamescope · GameMode · MangoHud</text>
  <line x1="92" y1="374" x2="572" y2="374" stroke="#5ac8fa" stroke-opacity=".1"/>
  <text x="92" y="398" fill="#6d5a8f" font-size="11.5" letter-spacing="1.4">SECURITY</text>
  <text x="572" y="398" text-anchor="end" fill="#cfe3ee" font-size="12.5">FDE · AppArmor · firewalld · all signed</text>
  <line x1="92" y1="408" x2="572" y2="408" stroke="#5ac8fa" stroke-opacity=".1"/>
  <text x="92" y="464" fill="#6d5a8f" font-size="11" letter-spacing="2.6">HOW AN UPDATE LANDS · ATOMIC, OR NOT AT ALL</text>
  <rect x="92" y="482" width="110" height="46" rx="8" fill="#0a1218" stroke="#5ac8fa" stroke-opacity=".3"/>
  <text x="104" y="502" fill="#5ac8fa" font-size="10.5" letter-spacing="1.4">01</text>
  <text x="104" y="519" fill="#f2e8ff" font-size="13">build</text>
  <path d="M204,505 L212,505" stroke="#5ac8fa" stroke-opacity=".45" stroke-width="1.4"/>
  <rect x="214" y="482" width="110" height="46" rx="8" fill="#0a1218" stroke="#5ac8fa" stroke-opacity=".3"/>
  <text x="226" y="502" fill="#5ac8fa" font-size="10.5" letter-spacing="1.4">02</text>
  <text x="226" y="519" fill="#f2e8ff" font-size="13">sign</text>
  <path d="M326,505 L334,505" stroke="#5ac8fa" stroke-opacity=".45" stroke-width="1.4"/>
  <rect x="336" y="482" width="110" height="46" rx="8" fill="#0a1218" stroke="#5ac8fa" stroke-opacity=".3"/>
  <text x="348" y="502" fill="#5ac8fa" font-size="10.5" letter-spacing="1.4">03</text>
  <text x="348" y="519" fill="#f2e8ff" font-size="13">commit</text>
  <path d="M448,505 L456,505" stroke="#5ac8fa" stroke-opacity=".45" stroke-width="1.4"/>
  <rect x="458" y="482" width="110" height="46" rx="8" fill="#0a1218" stroke="#5ac8fa" stroke-opacity=".3"/>
  <text x="470" y="502" fill="#5ac8fa" font-size="10.5" letter-spacing="1.4">04</text>
  <text x="470" y="519" fill="#f2e8ff" font-size="13">reboot</text>
  <circle r="3.4" fill="#5ac8fa"><animateMotion dur="4.2s" repeatCount="indefinite" path="M98,474 L568,474"/><animate attributeName="opacity" values="0;1;1;0" dur="4.2s" repeatCount="indefinite"/></circle>
  <rect x="636" y="96" width="500" height="448" rx="12" fill="#0d0a17" stroke="#5ac8fa" stroke-opacity=".26"/>
  <text x="664" y="128" fill="#6d5a8f" font-size="11" letter-spacing="2.6">WHERE FLOS ACTUALLY IS</text>
  <rect x="664" y="146" width="444" height="48" rx="8" fill="#ffb454" opacity=".12"/>
  <circle cx="688" cy="170" r="4" fill="#ffb454"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="704" y="175" fill="#ffb454" font-size="13.5" letter-spacing="1.2">PRE-RELEASE — NOTHING HAS BOOTED YET</text>
  <rect x="664" y="216" width="216" height="110" rx="10" fill="#0a1218" stroke="#5ac8fa" stroke-opacity=".22"/>
  <text x="684" y="272" fill="#5ac8fa" font-size="34" font-weight="bold">0</text>
  <text x="684" y="294" fill="#f2e8ff" font-size="11" letter-spacing="1.6">ISO IMAGES</text>
  <text x="684" y="312" fill="#6d5a8f" font-size="10.5">across nine build runs</text>
  <rect x="892" y="216" width="216" height="110" rx="10" fill="#0a1218" stroke="#5ac8fa" stroke-opacity=".22"/>
  <text x="912" y="272" fill="#5ac8fa" font-size="34" font-weight="bold">1 / 8</text>
  <text x="912" y="294" fill="#f2e8ff" font-size="11" letter-spacing="1.6">MILESTONES</text>
  <text x="912" y="312" fill="#6d5a8f" font-size="10.5">under way, none complete</text>
  <rect x="664" y="340" width="216" height="110" rx="10" fill="#0a1218" stroke="#5ac8fa" stroke-opacity=".22"/>
  <text x="684" y="396" fill="#5ac8fa" font-size="34" font-weight="bold">24</text>
  <text x="684" y="418" fill="#f2e8ff" font-size="11" letter-spacing="1.6">PACKAGES</text>
  <text x="684" y="436" fill="#6d5a8f" font-size="10.5">built from source</text>
  <rect x="892" y="340" width="216" height="110" rx="10" fill="#0a1218" stroke="#5ac8fa" stroke-opacity=".22"/>
  <text x="912" y="396" fill="#5ac8fa" font-size="34" font-weight="bold">5 + 1</text>
  <text x="912" y="418" fill="#f2e8ff" font-size="11" letter-spacing="1.6">DEPLOYMENTS</text>
  <text x="912" y="436" fill="#6d5a8f" font-size="10.5">kept, plus factory snapshot</text>
  <text x="664" y="500" fill="#7f93a3" font-size="12">the site tracks what is specified against what has actually run,</text>
  <text x="664" y="520" fill="#7f93a3" font-size="12">and says on its own front page that the second column is empty.</text>
  <text x="64" y="580" fill="#5ac8fa" font-size="13" letter-spacing="1.6">flo-os.de</text>
  <text x="1136" y="580" text-anchor="end" fill="#6d5a8f" font-size="11.5">no telemetry · no accounts · no cloud dependency</text>
</g>
<rect width="1200" height="612" fill="url(#scan)"/>
<rect width="1200" height="612" fill="url(#vignette)"/>
<rect x="0" y="-80" width="1200" height="80" fill="#5ac8fa" opacity=".05" filter="url(#soft)">
  <animate attributeName="y" values="-80;612" dur="7s" repeatCount="indefinite"/>
</rect>
</svg>
