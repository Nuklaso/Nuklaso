    <line x1="0" y1="294" x2="1200" y2="294" stroke-width="1.1" opacity=".60"/>
    <line x1="0" y1="313" x2="1200" y2="313" stroke-width="1.2" opacity=".70"/>
    <line x1="0" y1="335" x2="1200" y2="335" stroke-width="1.3" opacity=".80"/>
    <line x1="0" y1="361" x2="1200" y2="361" stroke-width="1.4" opacity=".85"/>
  </g>
  <g stroke-width=".9" opacity=".55">
