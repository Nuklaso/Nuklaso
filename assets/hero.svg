    <line x1="600" y1="246" x2="-460" y2="340"/>
    <line x1="600" y1="246" x2="-130" y2="340"/>
    <line x1="600" y1="246" x2="130" y2="340"/>
    <line x1="600" y1="246" x2="330" y2="340"/>
    <line x1="600" y1="246" x2="490" y2="340"/>
    <line x1="600" y1="246" x2="600" y2="340"/>
    <line x1="600" y1="246" x2="710" y2="340"/>
    <line x1="600" y1="246" x2="870" y2="340"/>
    <line x1="600" y1="246" x2="1070" y2="340"/>
    <line x1="600" y1="246" x2="1330" y2="340"/>
    <line x1="600" y1="246" x2="1660" y2="340"/>
    <line x1="600" y1="246" x2="2100" y2="340"/>
  </g>
</g>
<rect x="0" y="240" width="1200" height="34" fill="url(#fade)"/>

<g fill="#e9d5ff">
  <circle cx="120" cy="300" r="1.6" opacity=".7"><animate attributeName="cy" values="310;40" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="318" cy="300" r="1.2" opacity=".6"><animate attributeName="cy" values="320;30" dur="9s" begin="-3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="9s" begin="-3s" repeatCount="indefinite"/></circle>
  <circle cx="905" cy="300" r="1.7" opacity=".7"><animate attributeName="cy" values="315;35" dur="8s" begin="-5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="8s" begin="-5s" repeatCount="indefinite"/></circle>
  <circle cx="1078" cy="300" r="1.3" opacity=".6"><animate attributeName="cy" values="325;45" dur="10s" begin="-6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="10s" begin="-6.5s" repeatCount="indefinite"/></circle>
  <circle cx="680" cy="300" r="1.1" opacity=".5"><animate attributeName="cy" values="318;60" dur="11s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0" dur="11s" begin="-2s" repeatCount="indefinite"/></circle>
</g>

<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2.4">
  <text x="44" y="46" fill="#7c5ba6">SYS://PROFILE</text>
  <text x="1156" y="46" fill="#7c5ba6" text-anchor="end">REGENSBURG &#183; DE</text>
  <circle cx="196" cy="42" r="3.4" fill="#22d3ee"><animate attributeName="opacity" values="1;.15;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="208" y="46" fill="#22d3ee" opacity=".85">ONLINE</text>
</g>
<line x1="44" y1="58" x2="1156" y2="58" stroke="#a855f7" stroke-width="1" opacity=".22"/>

<g transform="translate(225,104) scale(1.5)">
  <use xlink:href="#glyphs" href="#glyphs" stroke="#a855f7" filter="url(#glow)" opacity=".85"/>
  <use xlink:href="#glyphs" href="#glyphs" stroke="#22d3ee" opacity=".30">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-3 1;2 -1;0 0;0 0" dur="6s" keyTimes="0;.72;.76;.8;.84;1" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#glyphs" href="#glyphs" stroke="#f0abfc" opacity=".30">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;3 -1;-2 1;0 0;0 0" dur="6s" keyTimes="0;.72;.76;.8;.84;1" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#glyphs" href="#glyphs" stroke="url(#wm)"/>
  <use xlink:href="#glyphs" href="#glyphs" stroke="url(#sweep)"/>
</g>

<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">
  <text x="600" y="262" fill="#cbb6e8" font-size="17" letter-spacing="5.5">PYTHON &#183; ALGORITHMS &#183; GAME AI &#183; AUTOMATION</text>
  <text x="600" y="296" fill="#6d5a8f" font-size="13" letter-spacing="3">build small things well, then build bigger things</text>
</g>

<g stroke="#22d3ee" stroke-width="2" fill="none" opacity=".75">
  <path d="M22,92 L22,22 L92,22"/>
  <path d="M1178,92 L1178,22 L1108,22"/>
  <path d="M22,248 L22,318 L92,318"/>
  <path d="M1178,248 L1178,318 L1108,318"/>
</g>

<rect width="1200" height="340" fill="url(#scan)"/>
<rect x="0" y="-60" width="1200" height="60" fill="#c084fc" opacity=".05" filter="url(#soft)">
  <animate attributeName="y" values="-60;340" dur="5.5s" repeatCount="indefinite"/>
