<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="NUKLASO">
<title>NUKLASO</title>
<defs>
  <linearGradient id="wm" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="78">
    <stop offset="0%" stop-color="#7c3aed">
      <animate attributeName="stop-color" values="#7c3aed;#c026d3;#22d3ee;#7c3aed" dur="9s" repeatCount="indefinite"/>
    </stop>
    <stop offset="55%" stop-color="#c084fc">
      <animate attributeName="stop-color" values="#c084fc;#f0abfc;#67e8f9;#c084fc" dur="9s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#22d3ee">
      <animate attributeName="stop-color" values="#22d3ee;#7c3aed;#c026d3;#22d3ee" dur="9s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>

  <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="-60" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity=".92"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    <animate attributeName="x1" values="-260;520" dur="4.2s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="-60;760" dur="4.2s" repeatCount="indefinite"/>
  </linearGradient>

  <radialGradient id="halo1" cx="50%" cy="46%" r="52%">
    <stop offset="0%" stop-color="#a855f7" stop-opacity=".30"/>
    <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="halo2" cx="20%" cy="85%" r="45%">
    <stop offset="0%" stop-color="#22d3ee" stop-opacity=".20"/>
    <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="halo3" cx="82%" cy="18%" r="40%">
    <stop offset="0%" stop-color="#e879f9" stop-opacity=".18"/>
    <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#08070c" stop-opacity="1"/>
    <stop offset="100%" stop-color="#08070c" stop-opacity="0"/>
  </linearGradient>

  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="9" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/></feMerge>
  </filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>

  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" opacity=".045"/>
  </pattern>

  <g id="glyphs" fill="none" stroke-width="11" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M0,78 L0,0 L56,78 L56,0"/>
    <path transform="translate(74,0)" d="M0,0 L0,60 L16,78 L40,78 L56,60 L56,0"/>
    <path transform="translate(148,0)" d="M0,0 L0,78 M54,2 L4,41 M20,29 L54,78"/>
    <path transform="translate(222,0)" d="M0,0 L0,78 L50,78"/>
    <path transform="translate(296,0)" d="M2,78 L28,0 L54,78 M13,50 L43,50"/>
    <path transform="translate(370,0)" d="M56,12 L44,0 L12,0 L0,12 L0,27 L12,39 L44,39 L56,51 L56,66 L44,78 L12,78 L0,66"/>
    <path transform="translate(444,0)" d="M16,0 L40,0 L56,16 L56,62 L40,78 L16,78 L0,62 L0,16 Z"/>
  </g>

  <clipPath id="frame"><rect width="1200" height="340"/></clipPath>
</defs>

<g clip-path="url(#frame)">

<rect width="1200" height="340" fill="#08070c"/>
<rect width="1200" height="340" fill="url(#halo1)"/>
<rect width="1200" height="340" fill="url(#halo2)"/>
<rect width="1200" height="340" fill="url(#halo3)"/>

<g stroke="#a855f7" opacity=".26">
