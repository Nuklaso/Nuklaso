<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="stack and focus">
<title>stack</title>
<defs>
  <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#7c3aed"/>
    <stop offset="100%" stop-color="#22d3ee"/>
  </linearGradient>
  <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#9333ea"/>
    <stop offset="100%" stop-color="#e879f9"/>
  </linearGradient>
  <radialGradient id="corona" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#a855f7" stop-opacity=".55"/>
    <stop offset="60%" stop-color="#a855f7" stop-opacity=".10"/>
    <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="shine" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="sglow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.1" fill="#a855f7" opacity=".16"/>
  </pattern>
</defs>

<rect width="1200" height="400" fill="#08070c"/>
<rect width="1200" height="400" fill="url(#dots)"/>

<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <text x="60" y="56" fill="#22d3ee" font-size="13" letter-spacing="4">02 &#183; WHERE THE HOURS GO</text>
  <line x1="60" y1="70" x2="1140" y2="70" stroke="#a855f7" stroke-opacity=".22"/>

  <g font-size="14" fill="#cbb6e8" text-anchor="end">
    <text x="284" y="119">python</text>
    <text x="284" y="163">algorithms &amp; ai</text>
    <text x="284" y="207">automation &amp; cli</text>
    <text x="284" y="251">git &amp; workflow</text>
    <text x="284" y="295">web / js</text>
    <text x="284" y="339">linux &amp; systems</text>
  </g>

  <g fill="#3a2d52">
    <rect x="300" y="101" width="480" height="14" rx="7"/>
    <rect x="300" y="145" width="480" height="14" rx="7"/>
    <rect x="300" y="189" width="480" height="14" rx="7"/>
    <rect x="300" y="233" width="480" height="14" rx="7"/>
    <rect x="300" y="277" width="480" height="14" rx="7"/>
    <rect x="300" y="321" width="480" height="14" rx="7"/>
  </g>

  <g>
    <rect x="300" y="101" width="0" height="14" rx="7" fill="url(#bg1)">
      <animate attributeName="width" values="0;442;442;0" keyTimes="0;.18;.94;1" dur="11s" repeatCount="indefinite"/>
    </rect>
    <rect x="300" y="145" width="0" height="14" rx="7" fill="url(#bg2)">
      <animate attributeName="width" values="0;0;384;384;0" keyTimes="0;.03;.21;.94;1" dur="11s" repeatCount="indefinite"/>
    </rect>
    <rect x="300" y="189" width="0" height="14" rx="7" fill="url(#bg1)">
      <animate attributeName="width" values="0;0;374;374;0" keyTimes="0;.06;.24;.94;1" dur="11s" repeatCount="indefinite"/>
    </rect>
    <rect x="300" y="233" width="0" height="14" rx="7" fill="url(#bg2)">
      <animate attributeName="width" values="0;0;346;346;0" keyTimes="0;.09;.27;.94;1" dur="11s" repeatCount="indefinite"/>
    </rect>
    <rect x="300" y="277" width="0" height="14" rx="7" fill="url(#bg1)">
      <animate attributeName="width" values="0;0;298;298;0" keyTimes="0;.12;.30;.94;1" dur="11s" repeatCount="indefinite"/>
    </rect>
    <rect x="300" y="321" width="0" height="14" rx="7" fill="url(#bg2)">
      <animate attributeName="width" values="0;0;264;264;0" keyTimes="0;.15;.33;.94;1" dur="11s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g fill="#ffffff" opacity=".35">
    <rect x="300" y="101" width="46" height="14" rx="7" fill="url(#shine)">
      <animate attributeName="x" values="300;700;300" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="300" y="189" width="46" height="14" rx="7" fill="url(#shine)">
      <animate attributeName="x" values="300;640;300" dur="6.4s" begin="-2s" repeatCount="indefinite"/>
    </rect>
    <rect x="300" y="277" width="46" height="14" rx="7" fill="url(#shine)">
      <animate attributeName="x" values="300;560;300" dur="7.2s" begin="-4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-size="12" fill="#6d5a8f">
    <text x="796" y="113">92</text>
    <text x="796" y="157">80</text>
    <text x="796" y="201">78</text>
    <text x="796" y="245">72</text>
    <text x="796" y="289">62</text>
    <text x="796" y="333">55</text>
  </g>
</g>

<g transform="translate(990,220)">
  <circle r="120" fill="url(#corona)"/>
  <g fill="none" stroke="#a855f7" stroke-opacity=".35">
    <ellipse rx="128" ry="46" stroke-dasharray="5 9">
      <animate attributeName="stroke-dashoffset" values="0;140" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="128" ry="46" transform="rotate(60)"/>
    <ellipse rx="128" ry="46" transform="rotate(-60)"/>
  </g>

  <circle r="34" fill="#0c0a12" stroke="#22d3ee" stroke-width="1.6"/>
  <circle r="34" fill="none" stroke="#e879f9" stroke-width="1.6" stroke-dasharray="14 200">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text y="6" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#f2e8ff" letter-spacing="1">py</text>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    <g transform="translate(128,0)">
      <circle r="5" fill="#22d3ee" filter="url(#sglow)"/>
      <circle r="3.4" fill="#e6faff"/>
    </g>
    <g transform="rotate(120) translate(128,0)">
      <circle r="5" fill="#e879f9" filter="url(#sglow)"/>
      <circle r="3.4" fill="#ffe9ff"/>
    </g>
    <g transform="rotate(240) translate(128,0)">
      <circle r="5" fill="#a855f7" filter="url(#sglow)"/>
      <circle r="3.4" fill="#f3e6ff"/>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
    <g transform="rotate(60) translate(84,0)">
      <circle r="4" fill="#67e8f9"/>
    </g>
    <g transform="rotate(200) translate(84,0)">
      <circle r="4" fill="#f0abfc"/>
    </g>
  </g>
</g>
</svg>
