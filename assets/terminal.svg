<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="terminal session">
<title>whoami</title>
<defs>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1a1226"/>
    <stop offset="100%" stop-color="#120e1c"/>
  </linearGradient>
  <radialGradient id="tglow" cx="50%" cy="0%" r="90%">
    <stop offset="0%" stop-color="#a855f7" stop-opacity=".16"/>
    <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
  </radialGradient>
  <filter id="tsoft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>

  <clipPath id="c1"><rect x="52" y="84" width="0" height="30"><animate attributeName="width" values="0;0;253;253;0;0" keyTimes="0;.043;.143;.964;.971;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="c3"><rect x="52" y="148" width="0" height="30"><animate attributeName="width" values="0;0;325;325;0;0" keyTimes="0;.229;.336;.964;.971;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="c5"><rect x="52" y="212" width="0" height="30"><animate attributeName="width" values="0;0;304;304;0;0" keyTimes="0;.421;.521;.964;.971;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="c7"><rect x="52" y="276" width="0" height="30"><animate attributeName="width" values="0;0;183;183;0;0" keyTimes="0;.6;.607;.964;.971;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
</defs>

<rect width="1200" height="400" fill="#08070c"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <text x="60" y="32" fill="#22d3ee" font-size="13" letter-spacing="4">01 &#183; WHOAMI</text>
  <line x1="60" y1="46" x2="1140" y2="46" stroke="#a855f7" stroke-opacity=".22"/>
</g>

<g transform="translate(0,40)">

<rect width="1200" height="360" fill="#08070c"/>
<rect x="20" y="20" width="1160" height="320" rx="12" fill="#0c0a12" stroke="#a855f7" stroke-opacity=".38" stroke-width="1.5"/>
<rect x="20" y="20" width="1160" height="320" rx="12" fill="url(#tglow)"/>
<path d="M32,20 H1168 a12,12 0 0 1 12,12 V60 H20 V32 a12,12 0 0 1 12,-12 Z" fill="url(#bar)"/>
<line x1="20" y1="60" x2="1180" y2="60" stroke="#a855f7" stroke-opacity=".28"/>

<g>
  <circle cx="46" cy="40" r="6" fill="#ff5f57"/>
  <circle cx="68" cy="40" r="6" fill="#febc2e"/>
  <circle cx="90" cy="40" r="6" fill="#28c840"/>
</g>
<text x="600" y="45" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#6d5a8f" letter-spacing="1.5">niklas@nuklaso: ~ &#8212; zsh &#8212; 120x34</text>

<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" letter-spacing="0">

  <g clip-path="url(#c1)">
    <text x="60" y="106" textLength="245" lengthAdjust="spacing"><tspan fill="#22d3ee">niklas@nuklaso</tspan><tspan fill="#6d5a8f">:~$ </tspan><tspan fill="#f2e8ff">whoami</tspan></text>
  </g>
  <rect x="60" y="92" width="10" height="18" fill="#22d3ee" opacity="0">
    <animate attributeName="x" values="60;60;305;305;60;60" keyTimes="0;.043;.143;.964;.971;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.043;.16;.17;1" dur="14s" repeatCount="indefinite"/>
  </rect>

  <text x="60" y="138" fill="#c9b6e6" opacity="0" textLength="439" lengthAdjust="spacing">Niklas - developer from Regensburg, Germany
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.164;.182;.964;.971;1" dur="14s" repeatCount="indefinite"/>
  </text>

  <g clip-path="url(#c3)">
    <text x="60" y="170" textLength="317" lengthAdjust="spacing"><tspan fill="#22d3ee">niklas@nuklaso</tspan><tspan fill="#6d5a8f">:~$ </tspan><tspan fill="#f2e8ff">cat stack.txt</tspan></text>
  </g>
  <rect x="60" y="156" width="10" height="18" fill="#22d3ee" opacity="0">
    <animate attributeName="x" values="60;60;377;377;60;60" keyTimes="0;.229;.336;.964;.971;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.229;.232;.352;.362;1" dur="14s" repeatCount="indefinite"/>
  </rect>

  <text x="60" y="202" fill="#c9b6e6" opacity="0" textLength="551" lengthAdjust="spacing">python - algorithms - automation - a bit of everything
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.357;.375;.964;.971;1" dur="14s" repeatCount="indefinite"/>
  </text>

  <g clip-path="url(#c5)">
    <text x="60" y="234" textLength="296" lengthAdjust="spacing"><tspan fill="#22d3ee">niklas@nuklaso</tspan><tspan fill="#6d5a8f">:~$ </tspan><tspan fill="#f2e8ff">cat now.txt</tspan></text>
  </g>
  <rect x="60" y="220" width="10" height="18" fill="#22d3ee" opacity="0">
    <animate attributeName="x" values="60;60;356;356;60;60" keyTimes="0;.421;.521;.964;.971;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.421;.424;.537;.547;1" dur="14s" repeatCount="indefinite"/>
  </rect>

  <text x="60" y="266" fill="#c9b6e6" opacity="0" textLength="500" lengthAdjust="spacing">teaching a machine to play 2048 better than i can
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.543;.561;.964;.971;1" dur="14s" repeatCount="indefinite"/>
  </text>

  <g clip-path="url(#c7)">
    <text x="60" y="298" textLength="175" lengthAdjust="spacing"><tspan fill="#22d3ee">niklas@nuklaso</tspan><tspan fill="#6d5a8f">:~$</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.6;.607;.964;.971;1" dur="14s" repeatCount="indefinite"/>
    <rect x="245" y="284" width="10" height="18" fill="#22d3ee">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

</g>

<rect x="20" y="-40" width="1160" height="40" fill="#c084fc" opacity=".05" filter="url(#tsoft)">
  <animate attributeName="y" values="-40;340" dur="7s" repeatCount="indefinite"/>
</rect>
</g>
</svg>
