<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="footer">
<title>end of transmission</title>
<defs>
  <radialGradient id="sun" cx="50%" cy="100%" r="70%">
    <stop offset="0%" stop-color="#e879f9" stop-opacity=".45"/>
    <stop offset="45%" stop-color="#a855f7" stop-opacity=".16"/>
    <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ffade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#07060b" stop-opacity="1"/>
    <stop offset="60%" stop-color="#07060b" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ftext" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#a855f7"/>
    <stop offset="50%" stop-color="#67e8f9"/>
    <stop offset="100%" stop-color="#e879f9"/>
  </linearGradient>
  <filter id="fglow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <clipPath id="fclip"><rect width="1200" height="240"/></clipPath>
</defs>

<g clip-path="url(#fclip)">
<rect width="1200" height="240" fill="#07060b"/>
<rect width="1200" height="240" fill="url(#sun)"/>

<g stroke="#a855f7" opacity=".3">
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 30" dur="3s" repeatCount="indefinite"/>
    <line x1="0" y1="140" x2="1200" y2="140" stroke-width=".7" opacity=".35"/>
    <line x1="0" y1="154" x2="1200" y2="154" stroke-width=".8" opacity=".45"/>
    <line x1="0" y1="172" x2="1200" y2="172" stroke-width=".9" opacity=".55"/>
    <line x1="0" y1="194" x2="1200" y2="194" stroke-width="1" opacity=".65"/>
    <line x1="0" y1="221" x2="1200" y2="221" stroke-width="1.1" opacity=".75"/>
    <line x1="0" y1="255" x2="1200" y2="255" stroke-width="1.2" opacity=".85"/>
  </g>
  <g stroke-width=".8" opacity=".5">
    <line x1="600" y1="134" x2="-800" y2="240"/>
    <line x1="600" y1="134" x2="-300" y2="240"/>
    <line x1="600" y1="134" x2="40" y2="240"/>
    <line x1="600" y1="134" x2="300" y2="240"/>
    <line x1="600" y1="134" x2="470" y2="240"/>
    <line x1="600" y1="134" x2="600" y2="240"/>
    <line x1="600" y1="134" x2="730" y2="240"/>
    <line x1="600" y1="134" x2="900" y2="240"/>
    <line x1="600" y1="134" x2="1160" y2="240"/>
    <line x1="600" y1="134" x2="1500" y2="240"/>
    <line x1="600" y1="134" x2="2000" y2="240"/>
  </g>
</g>
<rect x="0" y="128" width="1200" height="40" fill="url(#ffade)"/>

<text x="600" y="72" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="30" letter-spacing="9" fill="url(#ftext)" filter="url(#fglow)" opacity=".7">END OF TRANSMISSION</text>
<text x="600" y="72" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="30" letter-spacing="9" fill="url(#ftext)">END OF TRANSMISSION</text>

<text x="600" y="104" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="3.4" fill="#6d5a8f">thanks for scrolling &#183; now go build something</text>

<g>
  <circle cx="600" cy="134" r="4" fill="#67e8f9"/>
  <circle cx="600" cy="134" r="4" fill="none" stroke="#67e8f9" stroke-width="1.5">
    <animate attributeName="r" values="4;42" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".9;0" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="134" r="4" fill="none" stroke="#e879f9" stroke-width="1.5">
    <animate attributeName="r" values="4;42" dur="3.2s" begin="-1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".9;0" dur="3.2s" begin="-1.6s" repeatCount="indefinite"/>
  </circle>
</g>

<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#5b4a7a" letter-spacing="2">
  <text x="30" y="30">0x00 &#183; NUKLASO</text>
  <text x="1170" y="30" text-anchor="end">EOF</text>
</g>
</g>
</svg>
